
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game - BOYMURODOV JAHONGIR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1>🏓 PONG GAME</h1>

    <div class="scoreboard">
        <span>SEN: <b id="playerScore">0</b></span>
        <span>BOT: <b id="botScore">0</b></span>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="message">
            <h2>PONG GAME</h2>
            <p>To‘pni qaytar va g‘alaba qozon!</p>
            <button id="startBtn">O‘yinni boshlash</button>
        </div>
    </div>

    <p class="controls">
        📱 Telefon: barmog‘ing bilan raketkani sur<br>
        🖱️ Kompyuter: sichqonchani yuqoriga-pastga sur<br>
        ⌨️ Klaviatura: ↑ va ↓ tugmalari
    </p>

    <footer>
        <span>DASTUR MUALLIFI</span>
        <h2>BOYMURODOV JAHONGIR</h2>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
